<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HI Window Spammer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, sans-serif; color: #f7f7fb;
      background: radial-gradient(circle at top, #252b55, #10121f 65%);
    }
    main {
      width: min(92vw, 520px); padding: 38px; text-align: center;
      background: #1b1e30; border: 1px solid #373c5b; border-radius: 22px;
      box-shadow: 0 22px 70px #0007;
    }
    h1 { margin: 0 0 10px; font-size: 2.4rem; }
    p { color: #b9bfd8; line-height: 1.5; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 26px 0 16px; }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
      font: inherit; font-weight: 700; color: white; background: #5865d9;
    }
    button:hover { filter: brightness(1.12); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    button.secondary { background: #373c55; }
    button.danger { background: #a43c58; }
    #status { min-height: 24px; font-size: .92rem; color: #c9d0ed; }
    small { display: block; margin-top: 20px; color: #9299b8; }
  </style>
</head>
<body>
  <main>
    <h1>HI WINDOW SPAMMER</h1>
    <p>Open a few separate windows that all say <strong>HI</strong>.</p>
    <div class="controls" aria-label="Choose how many windows to open">
      <button data-count="1">Open 1</button>
      <button data-count="5">Open 5</button>
      <button data-count="10">Open 10</button>
      <button data-count="20">Open 20</button>
    </div>
    <button class="danger" id="closeAll">Close all windows</button>
    <p id="status" role="status" aria-live="polite">Choose a number to get started.</p>
    <small>Pop-ups may need to be allowed by your browser. Nothing opens until you click a button.</small>
  </main>
  <script>
    const openedWindows = [];
    const status = document.getElementById('status');

    function makeHiPage(win, number) {
      const doc = win.document;
      doc.open();
      doc.write(`<!doctype html><html lang="en"><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>HI #${number}</title>
        <style>
          html,body{height:100%;margin:0}
          body{display:grid;place-items:center;background:#171a2b;color:#fff;
            font: bold clamp(5rem, 25vw, 12rem) system-ui,sans-serif}
        </style></head><body>HI</body></html>`);
      doc.close();
    }

    document.querySelectorAll('[data-count]').forEach(button => {
      button.addEventListener('click', () => {
        const count = Math.min(20, Number(button.dataset.count));
        let opened = 0;
        for (let i = 0; i < count; i++) {
          const win = window.open('', '_blank', 'popup,width=420,height=320,resizable=yes');
          if (!win) break;
          openedWindows.push(win);
          makeHiPage(win, openedWindows.length);
          opened++;
        }
        status.textContent = opened === count
          ? `Opened ${opened} window${opened === 1 ? '' : 's'}.`
          : `Opened ${opened} of ${count}. Your browser blocked the rest; allow pop-ups and try again.`;
      });
    });

    document.getElementById('closeAll').addEventListener('click', () => {
      let closed = 0;
      while (openedWindows.length) {
        const win = openedWindows.pop();
        if (win && !win.closed) { win.close(); closed++; }
      }
      status.textContent = `Closed ${closed} window${closed === 1 ? '' : 's'}.`;
    });
  </script>
</body>
</html>
